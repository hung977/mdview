<!doctype html>
<html>
<head>

<base href="">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data: http: https:; style-src 'unsafe-inline'; font-src file: data:; script-src 'nonce-{{NONCE}}'; connect-src 'none'">
<style>{{CSS}}</style>
</head>
<body>
<div id="findbar" hidden>

  <button id="findnext" title="Next (↩)">&#8250;</button>
  <button id="finddone">Done</button>
</div>
<article id="content" class="markdown-body"></article>
<script nonce="{{NONCE}}">{{JS}}</script>
</body>
</html>
