name: mdview
options:
  bundleIdPrefix: com.hungpv
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  mdview:
    type: application
    platform: macOS
    sources:
      - path: mdview
        excludes: ["Sample.md", "sample.png", "wide.png", "Resources"]
      - path: mdview/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: mdview
        PRODUCT_MODULE_NAME: mdview
        PRODUCT_BUNDLE_IDENTIFIER: com.hungpv.mdview
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    info:
      path: mdview/Info.plist
      properties:
        CFBundleDisplayName: mdview
        CFBundleName: mdview
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]

  mdviewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [mdviewTests]
    dependencies:
      - target: mdview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mdview.app/Contents/MacOS/mdview"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  mdview:
    build:
      targets:
        mdview: all
        mdviewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [mdviewTests]
