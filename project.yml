name: mdview
options:
  bundleIdPrefix: com.hungpv
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  mdview:
    type: application
    platform: macOS
    sources:
      - path: mdview
        excludes: ["Sample.md", "sample.png", "wide.png", "Resources"]
      - path: mdview/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - target: mdviewQuickLook
    settings:
      base:
        PRODUCT_NAME: mdview
        PRODUCT_MODULE_NAME: mdview
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.hungpv.mdview
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    info:
      path: mdview/Info.plist
      properties:
        CFBundleDisplayName: mdview
        CFBundleName: mdview
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]

  mdviewQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: mdviewQuickLook
      - path: mdview/Viewer.swift
      - path: mdview/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - target: mdviewQuickLook
    settings:
      base:
        PRODUCT_NAME: mdviewQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.hungpv.mdview.quicklook
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: mdviewQuickLook/Info.plist
      properties:
        CFBundleDisplayName: mdview Quick Look
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
    entitlements:
      path: mdviewQuickLook/mdviewQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true   # WKWebView needs this inside a sandbox, even for local pages

  mdviewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [mdviewTests]
    dependencies:
      - target: mdview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/mdview.app/Contents/MacOS/mdview"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  mdview:
    build:
      targets:
        mdview: all
        mdviewQuickLook: all
        mdviewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [mdviewTests]
